<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShop - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen font-sans leading-normal tracking-normal">

    <nav class="bg-purple-800 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 font-bold text-xl tracking-tight">
                <i data-lucide="shield" class="text-purple-200"></i> AgriShop Admin
            </a>
            <div class="flex items-center gap-4">
                <span class="text-sm bg-purple-900 px-3 py-1 rounded-full flex items-center gap-2">
                    <i data-lucide="user" w-4 h-4></i>
                    <span id="admin-name">Admin</span>
                </span>
                <button onclick="logout()"
                    class="text-sm bg-purple-700 hover:bg-purple-600 px-3 py-1 rounded transition">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-8">

        <!-- Analytics Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-5 border-l-4 border-purple-500">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm font-bold uppercase">Total Users</p>
                        <h3 class="text-2xl font-bold text-gray-800" id="stat-users">...</h3>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full text-purple-600">
                        <i data-lucide="users"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-5 border-l-4 border-green-500">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm font-bold uppercase">Farmers</p>
                        <h3 class="text-2xl font-bold text-gray-800" id="stat-farmers">...</h3>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full text-green-600">
                        <i data-lucide="tractor"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-5 border-l-4 border-blue-500">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm font-bold uppercase">Buyers</p>
                        <h3 class="text-2xl font-bold text-gray-800" id="stat-buyers">...</h3>
                    </div>
                    <div class="bg-blue-100 p-3 rounded-full text-blue-600">
                        <i data-lucide="shopping-bag"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-5 border-l-4 border-yellow-500">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm font-bold uppercase">Total Products</p>
                        <h3 class="text-2xl font-bold text-gray-800" id="stat-products">...</h3>
                    </div>
                    <div class="bg-yellow-100 p-3 rounded-full text-yellow-600">
                        <i data-lucide="package"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Advisory Management -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i data-lucide="newspaper" class="text-blue-600"></i> Post Advisory
                    </h2>
                </div>
                <form id="advisory-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Title (English)</label>
                        <input type="text" id="adv-title"
                            class="w-full border p-2 rounded focus:ring focus:ring-purple-200" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Type</label>
                        <select id="adv-type" class="w-full border p-2 rounded">
                            <option value="Alert">Alert (Red)</option>
                            <option value="Guide">Guide (Green)</option>
                            <option value="Quality">Quality (Blue)</option>
                            <option value="Market">Market (Purple)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Content (English)</label>
                        <textarea id="adv-content" rows="3"
                            class="w-full border p-2 rounded focus:ring focus:ring-purple-200" required></textarea>
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">
                        Post Announcement
                    </button>
                </form>
            </div>

            <!-- User Management -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i data-lucide="users" class="text-green-600"></i> User Management
                    </h2>
                    <button onclick="loadUsers()" class="text-sm text-blue-600 hover:underline">Refresh</button>
                </div>
                <div class="overflow-y-auto h-64">
                    <table class="min-w-full text-sm">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="text-left py-2 px-2">Name</th>
                                <th class="text-left py-2 px-2">Role</th>
                                <th class="text-right py-2 px-2">Action</th>
                            </tr>
                        </thead>
                        <tbody id="user-list">
                            <tr>
                                <td colspan="3" class="text-center py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Product Management -->
            <div class="bg-white rounded-lg shadow-md p-6 mt-6 md:col-span-2">
                <div class="flex items-center justify-between mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i data-lucide="package" class="text-yellow-600"></i> Product Management
                    </h2>
                    <button onclick="loadProducts()" class="text-sm text-blue-600 hover:underline">Refresh</button>
                </div>
                <div class="overflow-y-auto h-64">
                    <table class="min-w-full text-sm">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="text-left py-2 px-2">Product Name</th>
                                <th class="text-left py-2 px-2">Price</th>
                                <th class="text-left py-2 px-2">Seller</th>
                                <th class="text-right py-2 px-2">Action</th>
                            </tr>
                        </thead>
                        <tbody id="product-list">
                            <tr>
                                <td colspan="4" class="text-center py-4">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        // Check Auth
        const role = localStorage.getItem('role');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (role !== 'admin') {
            alert('Access Denied: You are not an Admin.');
            window.location.href = 'index.html';
        }
        document.getElementById('admin-name').textContent = user.first_name || 'Admin';

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Load Stats
        async function loadStats() {
            try {
                const res = await fetch('api/admin.php?action=get_stats');
                const data = await res.json();

                document.getElementById('stat-users').textContent = data.total_users || 0;
                document.getElementById('stat-farmers').textContent = data.farmers || 0;
                document.getElementById('stat-buyers').textContent = data.buyers || 0;
                document.getElementById('stat-products').textContent = data.total_products || 0;
            } catch (e) { console.error('Stats error', e); }
        }

        // Load Users
        async function loadUsers() {
            try {
                const res = await fetch('api/admin.php?action=list_users');
                const data = await res.json();
                const tbody = document.getElementById('user-list');
                tbody.innerHTML = '';

                // Data loaded

                data.users.forEach(u => {
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50';
                    row.innerHTML = `
                        <td class="py-2 px-2">
                            <div class="font-medium">${u.first_name} ${u.last_name}</div>
                            <div class="text-xs text-gray-500">${u.email}</div>
                        </td>
                        <td class="py-2 px-2">
                            <span class="px-2 py-1 rounded text-xs font-bold ${u.role === 'farmer' ? 'bg-green-100 text-green-800' :
                            u.role === 'admin' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'
                        }">${u.role.toUpperCase()}</span>
                        </td>
                         <td class="py-2 px-2 text-right">
                            ${u.role !== 'admin' ? `<button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                lucide.createIcons();
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                const res = await fetch('api/admin.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete_user', id })
                });
                const data = await res.json();
                if (data.success) loadUsers();
                else alert('Failed to delete');
            } catch (e) { console.error(e); }
        }

        // Post Advisory
        document.getElementById('advisory-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('adv-title').value;
            const type = document.getElementById('adv-type').value;
            const content = document.getElementById('adv-content').value;

            try {
                const res = await fetch('api/advisory.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, type, content })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Announcement Posted!');
                    document.getElementById('advisory-form').reset();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (e) {
                console.error(e);
                alert('Connection error');
            }
        });

        // Load Products
        async function loadProducts() {
            try {
                const res = await fetch('api/admin.php?action=list_products');
                const data = await res.json();
                const tbody = document.getElementById('product-list');
                tbody.innerHTML = '';

                data.products.forEach(p => {
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50';
                    row.innerHTML = `
                        <td class="py-2 px-2">
                            <div class="font-medium">${p.name}</div>
                            <div class="text-xs text-gray-500">${p.category}</div>
                        </td>
                        <td class="py-2 px-2">${p.price} RWF</td>
                        <td class="py-2 px-2">
                            <div class="font-medium">${p.first_name} ${p.last_name}</div>
                        </td>
                        <td class="py-2 px-2 text-right">
                             <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                lucide.createIcons();
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this listing?')) return;
            try {
                const res = await fetch('api/admin.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete_product', id })
                });
                const data = await res.json();
                if (data.success) {
                    loadProducts();
                    loadStats(); // Refresh stats too
                }
                else alert('Failed to delete');
            } catch (e) { console.error(e); }
        }

        // Initialize
        loadUsers();
        loadStats();
        loadProducts();

    </script>
</body>

</html>
