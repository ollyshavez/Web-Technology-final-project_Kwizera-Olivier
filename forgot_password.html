<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AgriShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Forgot Password?</h2>
            <p class="text-gray-500 text-sm mt-2">Enter your email to receive a reset link</p>
        </div>

        <form id="forgot-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
            </div>

            <div class="text-red-500 text-sm hidden text-center bg-red-50 p-2 rounded" id="error-msg"></div>
            <div class="text-green-600 text-sm hidden text-center bg-green-50 p-2 rounded" id="success-msg"></div>

            <button type="submit"
                class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-lg">Send
                Link</button>
        </form>

        <p class="text-center mt-6 text-sm text-gray-600">
            Remembered it? <a href="login.html" class="text-green-600 font-bold hover:underline">Login</a>
        </p>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            try {
                const res = await fetch('api/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'forgot_password', email })
                });
                const data = await res.json();

                if (data.success) {
                    successMsg.textContent = "Reset link sent! (Opening simulation...)";
                    successMsg.classList.remove('hidden');
                    // SIMULATION: Open link directly or alert logic
                    // In a real app we wouldn't do this, but for local dev to prove it works:
                    setTimeout(() => {
                        if (confirm("SIMULATION: Click OK to open the reset link sent to your email.")) {
                            window.location.href = data.debug_link;
                        }
                    }, 1000);
                } else {
                    errorMsg.textContent = data.error || 'Failed to send link';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'Connection failed';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
