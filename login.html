<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShop - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="sprout" class="text-green-600 w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-gray-500 text-sm">Login with your email</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                        <input type="email" id="email"
                            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                            placeholder="name@example.com" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                        <input type="password" id="password"
                            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                            placeholder="Enter password" required>
                    </div>
                </div>
                <div class="text-right">
                    <a href="forgot_password.html"
                        class="text-sm text-green-600 hover:text-green-800 font-medium hover:underline">Forgot
                        password?</a>
                </div>

                <div class="text-red-500 text-sm hidden text-center bg-red-50 p-2 rounded" id="error-msg">Invalid
                    Credentials</div>

                <button type="submit"
                    class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-lg">Login</button>
            </form>

            <div class="mt-6 grid grid-cols-2 gap-3">
                <button type="button" onclick="mockSocialLogin('Google')"
                    class="flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    <span class="text-sm font-medium text-gray-700">Google</span>
                </button>
                <button type="button" onclick="mockSocialLogin('Facebook')"
                    class="flex items-center justify-center gap-2 bg-[#1877F2] rounded-lg py-2.5 hover:bg-[#1864cc] transition">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg"
                        class="w-5 h-5 brightness-0 invert" alt="Facebook">
                    <span class="text-sm font-medium text-white">Facebook</span>
                </button>
            </div>

            <p class="text-center mt-6 text-sm text-gray-600">
                Don't have an account? <a href="register.html"
                    class="text-green-600 font-bold hover:underline">Register</a>
            </p>
        </div>
    </div>

    <!-- Footer Script -->
    <script src="js/footer.js"></script>
    <script>
        lucide.createIcons();

        function mockSocialLogin(provider) {
            if (confirm(`Simulate login with ${provider}? (For Demo)`)) {
                // Mock User Data
                const mockUser = {
                    id: 999,
                    first_name: 'Social',
                    last_name: 'User',
                    email: `user@${provider.toLowerCase()}.com`,
                    role: 'buyer'
                };
                localStorage.setItem('user', JSON.stringify(mockUser));
                localStorage.setItem('role', 'buyer');
                window.location.href = 'index.html';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const res = await fetch('api/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', email, password })
                });

                const text = await res.text(); // Get raw text first
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error("Server Error: " + text);
                }

                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('role', data.user.role);
                    localStorage.setItem('lastActive', Date.now());

                    if (data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = err.message || 'Connection failed';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
