<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShop - Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

    <!-- Navbar (Ideally fetched dynamically, but hardcoded for simplicity in pure HTML) -->
    <nav class="sticky top-0 z-50 bg-green-700 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-90">
                <div class="bg-white p-1 rounded-full"><i data-lucide="sprout" class="text-green-700 w-6 h-6"></i></div>
                <span class="font-bold text-xl">AgriShop</span>
            </a>
            <div class="hidden md:flex items-center gap-6">
                <a href="index.html" class="hover:text-green-200">Home</a>
                <a href="market.html" class="font-bold border-b-2 border-white">Marketplace</a>
                <a href="advisory.html" class="hover:text-green-200">Advisory</a>
                <a href="dashboard.html" id="nav-dashboard-link" class="hover:text-green-200 hidden">Dashboard</a>
                <a href="admin.html" id="nav-admin-link"
                    class="hover:text-amber-300 font-bold hidden text-amber-200">Admin Panel</a>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-green-800 p-1 rounded-lg border border-green-600">
                    <i data-lucide="user" width="18"></i>
                    <select id="role-select" class="bg-transparent text-sm outline-none cursor-pointer font-medium">
                        <option value="buyer">Buyer</option>
                        <option value="farmer">Farmer</option>
                    </select>
                </div>
                <a href="cart.html" class="relative">
                    <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                    <span id="cart-count"
                        class="absolute -top-2 -right-2 bg-yellow-500 text-green-900 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div class="relative w-full md:w-1/3">
                <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                <input type="text" id="search-input" placeholder="Search produce..."
                    class="w-full pl-10 pr-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div class="flex gap-2 overflow-x-auto w-full md:w-auto" id="category-filters">
                <button class="filter-btn bg-green-600 text-white px-4 py-1 rounded-full text-sm shadow-md"
                    data-cat="All">All</button>
                <button class="filter-btn bg-gray-200 text-gray-700 px-4 py-1 rounded-full text-sm hover:bg-gray-300"
                    data-cat="Produce">Produce</button>
                <button class="filter-btn bg-gray-200 text-gray-700 px-4 py-1 rounded-full text-sm hover:bg-gray-300"
                    data-cat="Export">Export</button>
                <button class="filter-btn bg-gray-200 text-gray-700 px-4 py-1 rounded-full text-sm hover:bg-gray-300"
                    data-cat="Inputs">Inputs</button>
            </div>

            <!-- Add Product Button (Farmer Only) -->
            <button id="add-product-btn"
                class="hidden bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-green-700 flex items-center gap-2">
                <i data-lucide="plus"></i> Sell Produce
            </button>
        </div>

        <!-- Add Product Modal -->
        <div id="upload-modal"
            class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Sell Your Produce</h2>
                    <button id="close-modal" class="text-gray-400 hover:text-red-500"><i data-lucide="x"></i></button>
                </div>
                <form id="upload-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Product Image</label>
                        <input type="file" id="p-image" accept="image/*" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Product Name</label>
                        <input type="text" id="p-name" class="w-full border rounded p-2" required>
                        <p class="text-xs text-red-500 hidden" id="name-error">Invalid name format.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Price (RWF)</label>
                        <input type="number" id="p-price" class="w-full border rounded p-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Location</label>
                        <input type="text" id="p-location" class="w-full border rounded p-2" placeholder="e.g. Musanze"
                            required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700">Category</label>
                            <select id="p-category" class="w-full border rounded p-2 bg-white">
                                <option>Produce</option>
                                <option>Seeds</option>
                                <option>Export</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700">Unit</label>
                            <select id="p-unit" class="w-full border rounded p-2 bg-white">
                                <option>kg</option>
                                <option>pc</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl mt-2">Submit
                        Listing</button>
                </form>
            </div>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Products injected here -->
            <div class="col-span-full text-center py-10">Loading products...</div>
        </div>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/main.js?v=35"></script>
    <script src="js/footer.js"></script>
    <script>
        // Page specific logic
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            lucide.createIcons();
        });
    </script>
</body>

</html>
