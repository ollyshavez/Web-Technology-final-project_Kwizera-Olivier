<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShop - Fair Prices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

    <nav class="sticky top-0 z-50 bg-green-700 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-90">
                <div class="bg-white p-1 rounded-full"><i data-lucide="sprout" class="text-green-700 w-6 h-6"></i></div>
                <span class="font-bold text-xl">AgriShop</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-sm font-bold hover:text-green-200 flex items-center gap-1">
                    <i data-lucide="arrow-left" width="16"></i> Back
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-3xl font-bold text-gray-800">Market Trends</h2>
                <p class="text-gray-500">Real-time average prices across all markets.</p>
            </div>
            <div class="bg-green-100 p-3 rounded-full">
                <i data-lucide="trending-up" class="text-green-600 w-8 h-8"></i>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
            <table class="w-full text-left">
                <thead class="bg-gray-50 text-gray-600 text-sm uppercase">
                    <tr>
                        <th class="p-4">Product Name</th>
                        <th class="p-4">Category</th>
                        <th class="p-4">Avg. Price (RWF)</th>
                        <th class="p-4">Trend</th>
                    </tr>
                </thead>
                <tbody id="price-table" class="divide-y divide-gray-100 text-sm">
                    <tr>
                        <td colspan="4" class="p-6 text-center text-gray-400">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/main.js?v=34"></script>
    <script src="js/footer.js"></script>
    <script>
        lucide.createIcons();

        // Calculate functionality
        async function loadPrices() {
            const table = document.getElementById('price-table');
            try {
                const res = await fetch('api/products.php?limit=100'); // Fetch enough for stats
                const data = await res.json();
                const products = data.items || []; // Handle paginated response structure

                if (products.length === 0) {
                    table.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-400">No market data available yet.</td></tr>';
                    return;
                }

                // Group by name and calculate average
                const stats = {};
                products.forEach(p => {
                    const normName = p.name.trim().toLowerCase(); // Normalize
                    // Capitalize for display
                    const displayName = p.name.charAt(0).toUpperCase() + p.name.slice(1);

                    if (!stats[normName]) {
                        stats[normName] = { name: displayName, sum: 0, count: 0, category: p.category };
                    }
                    stats[normName].sum += p.price;
                    stats[normName].count++;
                });

                table.innerHTML = '';
                table.innerHTML = '';
                Object.keys(stats).forEach(key => {
                    const item = stats[key];
                    const avg = item.sum / item.count;
                    const trend = Math.random() > 0.5 ? 'up' : 'down'; // Simulated trend

                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50";
                    row.innerHTML = `
                        <td class="p-4 font-bold text-gray-800">${item.name}</td>
                        <td class="p-4"><span class="bg-gray-100 px-2 py-1 rounded text-xs text-gray-600">${item.category}</span></td>
                        <td class="p-4 font-mono text-green-700 font-bold">${formatRWF(avg)}</td>
                        <td class="p-4 flex items-center gap-1 ${trend === 'up' ? 'text-green-600' : 'text-red-500'}">
                            <i data-lucide="trending-${trend}" width="16"></i> ${Math.floor(Math.random() * 10)}%
                        </td>
                    `;
                    table.appendChild(row);
                });
                lucide.createIcons();
            } catch (e) {
                table.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-red-500">Failed to load market data.</td></tr>';
            }
        }
        loadPrices();
    </script>
</body>

</html>
