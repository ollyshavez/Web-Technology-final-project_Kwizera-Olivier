<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShop - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="user-plus" class="text-blue-600 w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Create Account</h2>
                <p class="text-gray-500 text-sm">Join AgriShop today</p>
            </div>

            <form id="register-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text" id="first_name"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text" id="last_name"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">I am a...</label>
                    <div class="grid grid-cols-3 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="farmer" class="peer sr-only">
                            <div
                                class="p-3 text-center border rounded-lg peer-checked:bg-green-100 peer-checked:border-green-500 peer-checked:text-green-700 hover:bg-gray-50 transition">
                                <i data-lucide="tractor" class="mx-auto mb-1 w-5 h-5"></i>
                                <span class="font-bold text-sm">Farmer</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="buyer" class="peer sr-only" checked>
                            <div
                                class="p-3 text-center border rounded-lg peer-checked:bg-blue-100 peer-checked:border-blue-500 peer-checked:text-blue-700 hover:bg-gray-50 transition">
                                <i data-lucide="shopping-bag" class="mx-auto mb-1 w-5 h-5"></i>
                                <span class="font-bold text-sm">Buyer</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="admin" class="peer sr-only">
                            <div
                                class="p-3 text-center border rounded-lg peer-checked:bg-purple-100 peer-checked:border-purple-500 peer-checked:text-purple-700 hover:bg-gray-50 transition">
                                <i data-lucide="shield" class="mx-auto mb-1 w-5 h-5"></i>
                                <span class="font-bold text-sm">Admin</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="text-red-500 text-sm hidden text-center bg-red-50 p-2 rounded" id="error-msg">Registration
                    Failed</div>

                <button type="submit"
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg">Create
                    Account</button>
            </form>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button type="button" onclick="mockSocialLogin('Google')"
                        class="flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-2.5 hover:bg-gray-50 transition">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                        <span class="text-sm font-medium text-gray-700">Google</span>
                    </button>
                    <button type="button" onclick="mockSocialLogin('Facebook')"
                        class="flex items-center justify-center gap-2 bg-[#1877F2] rounded-lg py-2.5 hover:bg-[#1864cc] transition">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg"
                            class="w-5 h-5 brightness-0 invert" alt="Facebook">
                        <span class="text-sm font-medium text-white">Facebook</span>
                    </button>
                </div>
            </div>

            <p class="text-center mt-6 text-sm text-gray-600">
                Already have an account? <a href="login.html" class="text-blue-600 font-bold hover:underline">Login</a>
            </p>
        </div>
    </div>

    <script src="js/footer.js"></script>
    <script>
        lucide.createIcons();

        function mockSocialLogin(provider) {
            if (confirm(`Simulate login with ${provider}? (For Demo)`)) {
                // Mock User Data
                const mockUser = {
                    id: 999,
                    first_name: 'Social',
                    last_name: 'User',
                    email: `user@${provider.toLowerCase()}.com`,
                    role: 'buyer'
                };
                localStorage.setItem('user', JSON.stringify(mockUser));
                localStorage.setItem('role', 'buyer');
                window.location.href = 'index.html';
            }
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.classList.add('hidden'); // Clear previous error

            const first_name = document.getElementById('first_name').value.trim();
            const last_name = document.getElementById('last_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            // Regex Validation
            const nameRegex = /^[A-Za-z\s]+$/;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const passRegex = /.{6,}/;

            if (!nameRegex.test(first_name) || !nameRegex.test(last_name)) {
                errorMsg.textContent = "Names must contain only letters and spaces.";
                errorMsg.classList.remove('hidden');
                return;
            }
            if (!emailRegex.test(email)) {
                errorMsg.textContent = "Please enter a valid email address.";
                errorMsg.classList.remove('hidden');
                return;
            }
            if (!passRegex.test(password)) {
                errorMsg.textContent = "Password must be at least 6 characters.";
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('api/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', first_name, last_name, email, password, role })
                });

                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error("Server Error: " + text);
                }

                if (data.success) {
                    alert('Account Created! Please Login.');
                    window.location.href = 'login.html';
                } else {
                    errorMsg.textContent = data.error || 'Registration failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = err.message || 'Connection failed';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
