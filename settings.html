<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - AgriShop</title>
    <script>
        if (!localStorage.getItem('user')) {
            window.location.replace('login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Navbar (Will be populated by main.js) -->
    <nav class="bg-green-700 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
                <div class="bg-white p-1 rounded-full"><i data-lucide="sprout" class="text-green-700 w-6 h-6"></i></div>
                AgriShop
            </a>

            <div class="flex items-center gap-3">
                <!-- User Profile / Auth Links (injected by main.js) -->
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-gray-50 px-8 py-6 border-b border-gray-100">
                <h1 class="text-2xl font-bold text-gray-800">Account Settings</h1>
                <p class="text-gray-500">Update your profile and personal details.</p>
            </div>

            <div class="p-8">
                <!-- Profile Picture Section -->
                <div class="mb-8 flex items-center gap-6">
                    <div class="relative group">
                        <div id="preview-container"
                            class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden border-4 border-white shadow-md">
                            <span id="initials-placeholder" class="text-3xl font-bold text-gray-400">?</span>
                            <img id="profile-preview" src="" alt="Profile" class="w-full h-full object-cover hidden">
                        </div>
                        <label for="profile_picture"
                            class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full cursor-pointer hover:bg-blue-700 shadow-sm transition">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                        </label>
                        <input type="file" id="profile_picture" class="hidden" accept="image/*">
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800">Profile Picture</h3>
                        <p class="text-sm text-gray-500 mb-2">JPG, GIF or PNG. Max size 2MB.</p>
                        <button id="upload-btn"
                            class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded transition hidden">Upload
                            New</button>
                        <button id="delete-pic-btn"
                            class="text-sm bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1 rounded transition hidden ml-2">Remove</button>
                    </div>
                </div>

                <hr class="border-gray-100 my-8">

                <!-- Personal Info Form -->
                <form id="settings-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                            <input type="text" id="first_name"
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                            <input type="text" id="last_name"
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                        <input type="tel" id="phone"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                            placeholder="+250 788 ...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Address / Location</label>
                        <input type="text" id="address"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none pb-2"
                            placeholder="e.g. Musanze, Rwanda">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bio (About You)</label>
                        <textarea id="bio" rows="4"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                            placeholder="Tell buyers about your farm..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="email"
                            class="w-full px-4 py-2 border rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed"
                            disabled>
                        <p class="text-xs text-gray-400 mt-1">Email cannot be changed.</p>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit"
                            class="bg-green-600 text-white font-bold py-2.5 px-6 rounded-lg hover:bg-green-700 transition shadow-lg flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/main.js?v=34"></script>
    <script src="js/footer.js"></script>
    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Populate Form
            document.getElementById('first_name').value = user.first_name || '';
            document.getElementById('last_name').value = user.last_name || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('address').value = user.address || '';
            document.getElementById('bio').value = user.bio || '';

            // Initial Profile Pic State
            const preview = document.getElementById('profile-preview');
            const placeholder = document.getElementById('initials-placeholder');
            const deleteBtn = document.getElementById('delete-pic-btn');

            if (user.profile_picture) {
                preview.src = user.profile_picture;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                deleteBtn.classList.remove('hidden');
            } else {
                placeholder.textContent = (user.first_name?.[0] || user.username?.[0] || '?').toUpperCase();
                deleteBtn.classList.add('hidden');
            }

            // Handle Delete Picture
            deleteBtn.onclick = async () => {
                if (confirm("Are you sure you want to remove your profile picture?")) {
                    try {
                        const res = await fetch('api/user.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id: user.id,
                                delete_picture: true
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert('Profile picture removed.');
                            localStorage.setItem('user', JSON.stringify(data.user));
                            window.location.reload();
                        } else {
                            alert('Error: ' + data.error);
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Connection failed');
                    }
                }
            };

            // Handle Image Selection
            const fileInput = document.getElementById('profile_picture');
            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Simple Preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);

                // Auto Upload logic or wait for save? 
                // Let's do instant upload for profile pic, usually better UX or wait. 
                // Let's do instant upload to keep it simple separate from form.

                if (confirm("Upload this picture now?")) {
                    const formData = new FormData();
                    formData.append('profile_picture', file);
                    formData.append('id', user.id);

                    try {
                        const res = await fetch('api/user.php', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert('Profile picture updated!');
                            localStorage.setItem('user', JSON.stringify(data.user));
                            window.location.reload(); // Reload to update navbar
                        } else {
                            alert('Error: ' + data.error);
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Upload failed');
                    }
                }
            });

            // Handle Info Update
            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const first_name = document.getElementById('first_name').value;
                const last_name = document.getElementById('last_name').value;
                const phone = document.getElementById('phone').value;
                const address = document.getElementById('address').value;
                const bio = document.getElementById('bio').value;

                try {
                    const res = await fetch('api/user.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: user.id,
                            first_name,
                            last_name,
                            phone,
                            address,
                            bio
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('Information updated!');
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.reload();
                    } else {
                        alert('Error: ' + (data.error || 'Update failed'));
                    }
                } catch (err) {
                    console.error(err);
                    alert('Connection failed');
                }
            });
        });
    </script>
</body>

</html>
